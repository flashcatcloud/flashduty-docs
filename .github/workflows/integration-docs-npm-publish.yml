name: Publish integration docs npm package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        working-directory: integration-docs
        run: npm install

      - name: Build compatibility package
        working-directory: integration-docs
        run: npm run build

      - name: Check compatibility package
        working-directory: integration-docs
        run: npm run check

      - name: Publish package
        working-directory: integration-docs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
        run: npm publish
