# api-review module map.
#
# Each entry describes one OpenAPI output bucket. `key` is the scope the user
# gives on the CLI (e.g. `on-call/template`). `path_prefixes` pull rows out of
# the pgy registry. `providers` narrows further when the same prefix is
# reused by multiple backends (rare). `repos` tells the handler extractor
# where to search for the Go handler that serves each path.
#
# `hidden: true` keeps a scope out of `--scope all` runs. Flip to false when
# you actually want to publish it.
#
# `tag_en` / `tag_zh` set the single tag name that every operation in this
# scope receives. Keep tags short — one per sub-module is plenty; splitting
# further just fragments navigation in Mintlify.
#
# base_path: where source repos live. Empty means "parent of cwd" (same
# convention as doc-review; the docs repo and source repos are siblings).
base_path: ""

# Top-level product module labels. Tags/folders emitted for sub-modules are
# prefixed with the matching parent label so Apifox (and Mintlify) render a
# two-level navigation: "On-call" → "Templates". Scopes without a slash
# (e.g. `monitors`, `rum`) have no parent and sit at the top level.
module_parents:
  on-call:
    en: "On-call"
    zh: "On-call"        # intentionally left English — the product name is not translated
    icon: "light-emergency-on"
  platform:
    en: "Platform"
    zh: "平台"
    icon: "gear"
  monitors:
    en: "Monitors"
    zh: "Monitors"
    icon: "chart-area"
  rum:
    en: "RUM"
    zh: "RUM"
    icon: "monitor-waveform"

# Unified default rate limits applied when the pgy registry does not declare
# an account-level limit for an API. NEVER expose total/global limits — only
# account-scoped ones belong in public docs. Keep these in sync with the
# pgy config once the team applies real caps.
default_rate_limits:
  per_second: 50       # 50 requests / second
  per_minute: 1000     # 1000 requests / minute

modules:
  # Each entry is: scope-key → { path_prefixes, providers, repos,
  # tag_en, tag_zh, icon, priority }.
  # Priority ascends numerically — lower number renders higher in
  # docs.json navigation. Developer-popularity order: event push +
  # incidents first, admin/platform last.

  # ── on-call ──────────────────────────────────────────────────
  # Note: /event/push/* is intentionally excluded. Those routes are
  # authenticated with an `integration` key per alert-source pairing,
  # not an `app_key`, so they are not part of the public (app_key)
  # API surface. They belong in the per-integration setup docs instead.
  on-call/incident:
    priority: 20
    tag_en: "Incidents"
    tag_zh: "故障管理"
    icon: "siren-on"
    path_prefixes: [/incident]
    providers: [event]
    repos:
      - name: fc-event
        paths: [cmd/server/controller/incident, cmd/server/controller/post_incident, logic/incident, logic/post_incident, model/incident, model/post_incident, structs]
    # 3-level sidebar. Each subgroup is matched by path_prefixes in order;
    # the first subgroup whose prefix matches wins. Operations not matched by
    # any subgroup trigger a generator warning.
    subgroups:
      - name_en: "Incident info"
        name_zh: "故障信息"
        icon: "circle-info"
        path_prefixes:
          - /incident/info
          - /incident/list
          - /incident/list-by-ids
          - /incident/past/list
          - /incident/feed
          - /incident/comment
          - /incident/field
          - /incident/custom-action
          - /incident/alert
          - /incident/reset
      - name_en: "Status lifecycle"
        name_zh: "状态流转"
        icon: "timeline"
        path_prefixes:
          - /incident/create
          - /incident/assign
          - /incident/responder
          - /incident/ack
          - /incident/unack
          - /incident/snooze
          - /incident/wake
          - /incident/reopen
          - /incident/resolve
          - /incident/merge
          - /incident/disable-merge
          - /incident/remove
      - name_en: "War room"
        name_zh: "作战室"
        icon: "shield-halved"
        path_prefixes:
          - /incident/war-room
      - name_en: "Post-mortem"
        name_zh: "故障复盘"
        icon: "file-lines"
        path_prefixes:
          - /incident/post-mortem

  on-call/channel:
    priority: 30
    tag_en: "Channels"
    tag_zh: "协作空间"
    icon: "comments"
    path_prefixes: [/channel]
    providers: [event]
    repos:
      - name: fc-event
        paths: [cmd/server/controller/channel, logic/channel, model/channel, structs]
    # Mixed nav: CRUD operations stay at module root; rule families are each a
    # subgroup. Root-level ops (those not matched by any subgroup prefix) render
    # flat alongside the subgroup folders.
    subgroups:
      - name_en: "Escalation rules"
        name_zh: "分派策略"
        icon: "arrow-up-right-dots"
        path_prefixes:
          - /channel/escalate/rule
      - name_en: "Silence rules"
        name_zh: "静默策略"
        icon: "bell-slash"
        path_prefixes:
          - /channel/silence/rule
      - name_en: "Inhibit rules"
        name_zh: "抑制策略"
        icon: "volume-xmark"
        path_prefixes:
          - /channel/inhibit/rule
      - name_en: "Drop rules"
        name_zh: "排除规则"
        icon: "filter-circle-xmark"
        path_prefixes:
          - /channel/unsubscribe/rule
      - name_en: "Routing rules"
        name_zh: "路由规则"
